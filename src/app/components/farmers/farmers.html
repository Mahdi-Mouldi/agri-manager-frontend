    <div class="farmers-container">

    <!-- Header -->
    <div class="page-header">
        <h2>Farmers Management</h2>
        <button class="btn-add" (click)="openModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Add Farmer
        </button>
    </div>

    <!-- Search -->
    <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
        type="text"
        class="search-input"
        placeholder="Search farmers by name, email, or phone..."
        [(ngModel)]="searchTerm"
        />
    </div>

    <!-- Table -->
    <div class="table-wrap">
        <table class="farmers-table">
        <thead>
            <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th class="actions-col">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let farmer of filteredFarmers">
            <td class="name-cell">{{ farmer.name }}</td>
            <td>{{ farmer.email }}</td>
            <td>{{ farmer.phone }}</td>
            <td class="actions-cell">
                <button class="btn-icon btn-edit" (click)="openEditModal(farmer)" title="Edit">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
                </button>
                <button class="btn-icon btn-delete" (click)="deleteFarmer(farmer.id)" title="Delete">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                    <path d="M10 11v6"/><path d="M14 11v6"/>
                    <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                </svg>
                </button>
            </td>
            </tr>

            <!-- Empty state -->
            <tr *ngIf="filteredFarmers.length === 0">
            <td colspan="4" class="empty-state">No farmers found.</td>
            </tr>
        </tbody>
        </table>
    </div>

    </div>

    <!-- ─── Modal ─────────────────────────────────── -->
    <div class="modal-overlay" *ngIf="showModal" (click)="closeModal()">
    <div class="modal" (click)="$event.stopPropagation()">

        <div class="modal-header">
        <h3>{{ editMode ? 'Edit Farmer' : 'Add New Farmer' }}</h3>
        <button class="modal-close" (click)="closeModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        </button>
        </div>

        <div class="modal-body">
        <div class="form-group">
            <label>Name</label>
            <input type="text" [(ngModel)]="form.name" placeholder="Enter farmer name" [class.error]="formErrors.name" />
            <span class="error-msg" *ngIf="formErrors.name">Name is required</span>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" [(ngModel)]="form.email" placeholder="Enter email address" [class.error]="formErrors.email" />
            <span class="error-msg" *ngIf="formErrors.email">Valid email is required</span>
        </div>

        <div class="form-group">
            <label>Phone</label>
            <input type="text" [(ngModel)]="form.phone" placeholder="Enter phone number" />
        </div>
        </div>

        <div class="modal-footer">
        <button class="btn-cancel" (click)="closeModal()">Cancel</button>
        <button class="btn-submit" (click)="submitForm()">
            {{ editMode ? 'Save Changes' : 'Add Farmer' }}
        </button>
        </div>

    </div>
    </div>
