<div class="fermes-container">

  <!-- Header -->
  <div class="page-header">
    <h2>Fermes Management</h2>
    <button class="btn-add" (click)="openModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Add Ferme
    </button>
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" class="search-input" placeholder="Search fermes by name or address..."
      [(ngModel)]="searchTerm"/>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <table class="fermes-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Address</th>
          <th>Superficie (ha)</th>
          <th>Description</th>
          <th class="actions-col">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let ferme of filteredFermes">
          <td class="name-cell">{{ ferme.ferme_name }}</td>
          <td>{{ ferme.ferme_address }}</td>
          <td>{{ ferme.superficieTotale }}</td>
          <td>{{ ferme.description }}</td>
          <td class="actions-cell">
            <button class="btn-icon btn-edit" (click)="openEditModal(ferme)" title="Edit">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
            </button>
            <button class="btn-icon btn-delete" (click)="deleteFerme(ferme.id!)" title="Delete">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                <path d="M10 11v6"/><path d="M14 11v6"/>
                <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
              </svg>
            </button>
          </td>
        </tr>
        <tr *ngIf="filteredFermes.length === 0">
          <td colspan="5" class="empty-state">No fermes found.</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<!-- Modal -->
<div class="modal-overlay" *ngIf="showModal" (click)="closeModal()">
  <div class="modal" (click)="$event.stopPropagation()">

    <div class="modal-header">
      <h3>{{ editMode ? 'Edit Ferme' : 'Add New Ferme' }}</h3>
      <button class="modal-close" (click)="closeModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="modal-body">
      <div class="form-group">
        <label>Nom de la ferme</label>
        <input type="text" [(ngModel)]="form.ferme_name" placeholder="Enter ferme name" [class.error]="formErrors.ferme_name"/>
        <span class="error-msg" *ngIf="formErrors.ferme_name">Name is required</span>
      </div>
      <div class="form-group">
        <label>Adresse</label>
        <input type="text" [(ngModel)]="form.ferme_address" placeholder="Enter address" [class.error]="formErrors.ferme_address"/>
        <span class="error-msg" *ngIf="formErrors.ferme_address">Address is required</span>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Superficie (ha)</label>
          <input type="number" [(ngModel)]="form.superficieTotale" placeholder="0.0"/>
        </div>
        <div class="form-group">
          <label>Farmer ID</label>
          <input type="number" [(ngModel)]="form.farmer_id" placeholder="Farmer ID"/>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Latitude</label>
          <input type="number" [(ngModel)]="form.latitude" placeholder="0.000000"/>
        </div>
        <div class="form-group">
          <label>Longitude</label>
          <input type="number" [(ngModel)]="form.longitude" placeholder="0.000000"/>
        </div>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea [(ngModel)]="form.description" placeholder="Enter description" rows="3"></textarea>
      </div>
      <div class="error-alert" *ngIf="errorMessage">{{ errorMessage }}</div>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" (click)="closeModal()">Cancel</button>
      <button class="btn-submit" (click)="submitForm()">
        {{ editMode ? 'Save Changes' : 'Add Ferme' }}
      </button>
    </div>

  </div>
</div>
